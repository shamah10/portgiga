[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; -O3: velocidade do SHA-256. O resto tira do binário distribuído os caminhos de pastas deste PC e as mensagens de depuração.
build_flags = -O3 -DCORE_DEBUG_LEVEL=0 -fmacro-prefix-map=${platformio.packages_dir}=pkg -fmacro-prefix-map=${platformio.core_dir}=pio -fmacro-prefix-map=${PROJECT_DIR}=. -ffile-prefix-map=${platformio.packages_dir}=pkg
